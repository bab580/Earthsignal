services:
  - type: web
    name: earthsignal
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: EARTHSIGNAL_SENSOR_DB
        value: /var/data/earthsignal_sensors.sqlite3
      - key: EARTHSIGNAL_DEVICE_TOKEN
        generateValue: true
      - key: EARTHSIGNAL_ALLOW_UNAUTHENTICATED_SENSOR_INGESTION
        value: "false"
      - key: AFRICASTALKING_SANDBOX
        value: "true"
      - key: EARTHSIGNAL_SMS_SEND_HOUR_UTC
        value: "5"
    disk:
      name: earthsignal-data
      mountPath: /var/data
      sizeGB: 1
